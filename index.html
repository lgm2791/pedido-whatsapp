<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pedido de Comida</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f6f7f9;color:#17202a}.wrap{max-width:720px;margin:auto;padding:16px 14px 110px}.hero{background:#128c7e;color:white;border-radius:18px;padding:20px 18px}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;font-size:14px}h2{font-size:17px;margin:20px 2px 8px}.p{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #e7e9ee;border-radius:14px;padding:12px;margin:8px 0}.i{flex:1}.n{font-weight:650;font-size:15px}.pr{color:#667085;font-size:13px;margin-top:4px}.q{display:flex;align-items:center;gap:6px}.q button{width:36px;height:36px;border:0;border-radius:10px;background:#eef2f4;font-size:22px}.q input{width:46px;height:36px;border:1px solid #d8dde3;border-radius:10px;text-align:center;font-size:16px;font-weight:700}.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.bar{max-width:720px;margin:auto;display:flex;align-items:center;gap:10px}.total{min-width:95px}.total small{display:block;color:#667085}.send{flex:1;background:#25d366;border:0;border-radius:13px;padding:14px 8px;font-weight:800}.clear{border:0;background:none;color:#667085}.note{font-size:12px;color:#667085;margin:10px 2px}</style></head><body><div class="wrap"><div class="hero"><h1>📋 Hacer Pedido</h1><p>Selecciona únicamente la cantidad de bolsas que deseas. Al terminar, toca <b>Enviar pedido por WhatsApp</b>.</p></div><div class="note">Productos de 5 lb por bolsa, excepto flautas.</div><div id="list"></div></div><div class="sticky"><div class="bar"><div class="total"><small>Total</small><strong id="total">$0.00</strong></div><button class="clear" id="clear">Limpiar</button><button class="send" id="send">Enviar pedido por WhatsApp</button></div></div><script>const PHONE='17136325380';const D=[['🥩 Carne de Res',[['Barbacoa Taquera',66],['Beef Birria Shredded',58.67],['Picadillo Traditional - w/ Peas, Carrots & Potatoes',31.73],['Picadillo Chipotle - w/ Potatoes',32.67],['Carne Guisada Ranchera',51.33],['Carne Roja',48.60],['Carne Verde',48.60],['Carne Asada Para Tacos',61.87],['Bistec Salsa Verde',45.53],['Bistec Salsa Ranchera',45.53],['Beef Taco Meat',36.53],['Albondigas (Meatballs)',29.40]]],['🐷 Carne de Puerco',[['Asado de Puerco',35.86],['Chicharron Molcajeteado',34.57],['Chicharron Prensado Verde',30.71],['Chicharron Prensado Rojo',30.71],['Pork Pastor',36.50],['Carnitas Michoacan',34.86],['Costilla en Salsa Verde',35.79],['Costillas en Salsa Tatemada',35.79],['Chicharron Para Tronar (Pork Belly Strips)',66.43]]],['🍗 Pollo',[['Pollo Tinga',35.33],['Pollo Rojo',36],['Pollo Verde',36],['Milanesa de Pollo (Crudo)',38.27],['Pollo Mole Casero',34]]],['🍚 Arroz y Frijoles',[['Arroz Mexicano w/ Vegetable',17],['Arroz Mexicano Vegan w/o Vegetables',15.58],['Arroz Blanco w/ Vegetables',16.08],['Frijoles Pintos Refritos',12.29],['Beans Pinto Refried Vegan',12.29],['Frijoles Charros',12.79]]],['🥣 Sopas y Caldos',[['Menudo Rojo',28.25],['Pozole Verde de Pollo',39.58],['Pozole Rojo de Puerco',27.92],['Birria Broth Consumme',17.42]]],['🌶️ Salsas',[['Salsa Estilo Monterrey (Verde)',18.58],['Salsa Habanera (Naranja)',18.58],['Salsa Roja Taquera',18.25]]],['🌮 Flautas',[['Pollo con Papa (25 unidades)',30],['Pollo con Queso (25 unidades)',30]]]];const L=document.getElementById('list');D.forEach(([c,a])=>{L.insertAdjacentHTML('beforeend','<h2>'+c+'</h2>');a.forEach(([n,p])=>L.insertAdjacentHTML('beforeend',`<div class="p" data-name="${n}" data-price="${p}"><div class="i"><div class="n">${n}</div><div class="pr">$${p.toFixed(2)} / bolsa</div></div><div class="q"><button class="m">−</button><input type="number" min="0" value="0" inputmode="numeric"><button class="a">+</button></div></div>`))});const P=[...document.querySelectorAll('.p')];function calc(){let t=0;P.forEach(x=>{let i=x.querySelector('input'),q=Math.max(0,parseInt(i.value||0));i.value=q;t+=q*+x.dataset.price});total.textContent=t.toLocaleString('en-US',{style:'currency',currency:'USD'})}P.forEach(x=>{let i=x.querySelector('input');x.querySelector('.a').onclick=()=>{i.value=+i.value+1;calc()};x.querySelector('.m').onclick=()=>{i.value=Math.max(0,+i.value-1);calc()};i.oninput=calc});clear.onclick=()=>{P.forEach(x=>x.querySelector('input').value=0);calc()};send.onclick=()=>{let s=[],t=0;P.forEach(x=>{let q=+x.querySelector('input').value;if(q){let z=q*+x.dataset.price;t+=z;s.push(`• ${x.dataset.name} — ${q} bolsa${q==1?'':'s'} — $${z.toFixed(2)}`)}});if(!s.length)return alert('Selecciona al menos un producto.');let m=['Hola, quiero hacer el siguiente pedido:','',...s,'',`TOTAL: $${t.toFixed(2)}`].join('\n');location.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(m)}`};calc()</script></body></html>
