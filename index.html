ton class="m">−</button><input type="number" min="0" value="0" inputmode="numeric"><button class="a">+</button></div></div>`)})});const P=[...document.querySelectorAll('.p')];function calc(){let t=0;P.forEach(x=>{let i=x.querySelector('input'),q=Math.max(0,parseInt(i.value||0));i.value=q;t+=q*+x.dataset.price});total.textContent=t.toLocaleString('en-US',{style:'currency',currency:'USD'});return t}P.forEach(x=>{let i=x.querySelector('input');x.querySelector('.a').onclick=()=>{i.value=+i.value+1;calc()};x.querySelector('.m').onclick=()=>{i.value=Math.max(0,+i.value-1);calc()};i.oninput=calc});clear.onclick=()=>{P.forEach(x=>x.querySelector('input').value=0);calc()};sendBtn.onclick=async()=>{const name=custName.value.trim(),phone=custPhone.value.trim();if(!name){custName.focus();return alert('Ingresa tu nombre.')}if(!phone){custPhone.focus();return alert('Ingresa tu teléfono.')}localStorage.setItem('pedido_name',name);localStorage.setItem('pedido_phone',phone);let s=[],items=[],t=0;P.forEach(x=>{let q=+x.querySelector('input').value;if(q){let price=+x.dataset.price,cost=+x.dataset.cost,z=q*price,unit=x.dataset.unit||'bolsa';t+=z;const unitText=unit==='pieza'?`pieza${q==1?'':'s'}`:`bolsa${q==1?'':'s'}`;s.push(`• ${x.dataset.name} — ${q} ${unitText} — $${z.toFixed(2)}`);items.push({itemNumber:x.dataset.item,description:x.dataset.name,qty:q,salePrice:price,cost:cost,unit})}});if(!items.length)return alert('Selecciona al menos un producto.');const payload={name,phone,total:Number(t.toFixed(2)),items};let m=['Hola, quiero hacer el siguiente pedido:','',`Nombre: ${name}`,`Teléfono: ${phone}`,'',...s,'',`TOTAL: $${t.toFixed(2)}`].join('\n');sendBtn.disabled=true;sendBtn.textContent='Registrando...';try{await fetch(ORDER_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});sendBtn.textContent='Abriendo WhatsApp...';window.location.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(m)}`}catch(err){sendBtn.disabled=false;sendBtn.textContent='Enviar por WhatsApp';alert('No se pudo registrar el pedido. Intenta nuevamente.')}};calc()</script></body></html>
