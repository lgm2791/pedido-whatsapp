<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pedido de Comida</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f6f7f9;color:#17202a}.wrap{max-width:720px;margin:auto;padding:16px 14px 92px}.hero{background:#128c7e;color:white;border-radius:18px;padding:20px 18px}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;font-size:14px}.customer{background:#128c7e;border-radius:14px;padding:14px;margin:12px 0 8px}.customer input{width:100%;height:42px;border:1px solid #d8dde3;border-radius:10px;padding:0 12px;font-size:16px;margin-bottom:10px;background:#fff;color:#17202a}.customer input:last-child{margin-bottom:0}h2{font-size:17px;margin:20px 2px 8px}.p{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #e7e9ee;border-radius:14px;padding:12px;margin:8px 0}.i{flex:1}.n{font-weight:650;font-size:15px}.pr{color:#667085;font-size:13px;margin-top:4px}.q{display:flex;align-items:center;gap:6px}.q button{width:36px;height:36px;border:0;border-radius:10px;background:#eef2f4;font-size:22px}.q input{width:46px;height:36px;border:1px solid #d8dde3;border-radius:10px;text-align:center;font-size:16px;font-weight:700}.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:7px 14px calc(7px + env(safe-area-inset-bottom))}.bar{max-width:720px;margin:auto;display:flex;align-items:center;gap:8px}.total{min-width:88px;line-height:1.05}.total small{display:block;color:#667085;font-size:11px;font-weight:700;text-transform:uppercase}.total strong{font-size:18px}.send{margin-left:auto;background:#25d366;border:0;border-radius:11px;padding:11px 16px;font-weight:800;white-space:nowrap}.send:disabled{opacity:.65}.clear{border:0;background:none;color:#667085;padding:8px 10px}.note{font-size:12px;color:#667085;margin:10px 2px;font-weight:700}@media(max-width:430px){.send{padding:11px 13px;font-size:13px}.clear{padding:8px 5px}.total{min-width:75px}}</style></head><body><div class="wrap"><div class="hero"><h1>Arma tu pedido con lo que más se te antoje!</h1><p>Selecciona la cantidad de bolsas que deseas y envía tu pedido por WhatsApp.</p></div><div class="customer"><input id="custName" type="text" autocomplete="name" placeholder="Nombre" aria-label="Nombre"><input id="custPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Teléfono" aria-label="Teléfono"></div><div class="note">Productos de 5 lb por bolsa, excepto flautas.</div><div id="list"></div></div><div class="sticky"><div class="bar"><div class="total"><small>Total</small><strong id="total">$0.00</strong></div><button class="clear" id="clear">Borrar</button><button class="send" id="send">Enviar por WhatsApp</button></div></div><script>const PHONE='17136325380';const ORDER_API='https://script.google.com/macros/s/AKfycbwhhCmTY5tVaDgmNTGPggoRyizzLAP5_sQKckNexkR52JmpY0zNqkmef-msn0LZ3ftv/exec';const D=[['🥩 Carne de Res',[['1003G','Barbacoa Taquera',66,49.50],['1006G','Beef Birria Shredded',58.67,44.00],['1027B','Picadillo Traditional - w/ Peas, Carrots & Potatoes',31.73,23.80],['1027D','Picadillo Chipotle - w/ Potatoes',32.67,24.50],['1036A','Carne Guisada Ranchera',51.33,38.50],['1065A','Carne Roja',48.60,36.45],['1066A','Carne Verde',48.60,36.45],['1021C','Carne Asada Para Tacos',61.87,46.40],['1019A','Bistec Salsa Verde',45.53,34.15],['1020A','Bistec Salsa Ranchera',45.53,34.15],['1087A','Beef Taco Meat',36.53,27.40],['1089A','Albondigas (Meatballs)',29.40,22.05]]],['🐷 Carne de Puerco',[['1002A','Asado de Puerco',35.86,25.10],['1004A','Chicharron Molcajeteado',34.57,24.20],['1038B','Chicharron Prensado Verde',30.71,21.50],['1037A','Chicharron Prensado Rojo',30.71,21.50],['1018A','Pork Pastor',36.50,25.55],['1054A','Carnitas Michoacan',34.86,24.40],['1051B','Costilla en Salsa Verde',35.79,25.05],['1092A','Costillas en Salsa Tatemada',35.79,25.05],['1019A','Chicharron Para Tronar (Pork Belly Strips)',66.43,46.50]]],['🍗 Pollo',[['1094A','Pollo Tinga',35.33,26.50],['1015A','Pollo Rojo',36.00,27.00],['1022A','Pollo Verde',36.00,27.00],['1058A','Milanesa de Pollo (Crudo)',38.27,28.70],['1025A','Pollo Mole Casero',34.00,25.50]]],['🍚 Arroz y Frijoles',[['1001A','Arroz Mexicano w/ Vegetable',17.00,10.20],['1032A','Arroz Mexicano Vegan w/o Vegetables',15.58,9.35],['1031A','Arroz Blanco w/ Vegetables',16.08,9.65],['1007A','Frijoles Pintos Refritos',12.29,8.60],['1007C','Beans Pinto Refried Vegan',12.29,8.60],['1053B','Frijoles Charros',12.79,8.95]]],['🥣 Sopas y Caldos',[['3001','Menudo Rojo',28.25,16.95],['1072A','Pozole Verde de Pollo',39.58,23.75],['1085A','Pozole Rojo de Puerco',27.92,16.75],['1006E','Birria Broth Consumme',17.42,10.45]]],['🌶️ Salsas',[['1074A','Salsa Estilo Monterrey (Verde)',18.58,11.15],['1026A','Salsa Habanera (Naranja)',18.58,11.15],['1012B','Salsa Roja Taquera',18.25,10.95]]],['🌮 Flautas',[['','Pollo con Papa (25 unidades)',30.00,18.88],['','Pollo con Queso (25 unidades)',30.00,18.88]]]];const custName=document.getElementById('custName'),custPhone=document.getElementById('custPhone'),sendBtn=document.getElementById('send');custName.value=localStorage.getItem('pedido_name')||'';custPhone.value=localStorage.getItem('pedido_phone')||'';custName.addEventListener('change',()=>localStorage.setItem('pedido_name',custName.value.trim()));custPhone.addEventListener('change',()=>localStorage.setItem('pedido_phone',custPhone.value.trim()));const L=document.getElementById('list');D.forEach(([c,a])=>{L.insertAdjacentHTML('beforeend','<h2>'+c+'</h2>');a.forEach(([item,n,p,cost])=>L.insertAdjacentHTML('beforeend',`<div class="p" data-item="${item}" data-name="${n}" data-price="${p}" data-cost="${cost}"><div class="i"><div class="n">${n}</div><div class="pr">$${p.toFixed(2)} • bolsa de 5 lb</div></div><div class="q"><button class="m">−</button><input type="number" min="0" value="0" inputmode="numeric"><button class="a">+</button></div></div>`))});const P=[...document.querySelectorAll('.p')];function calc(){let t=0;P.forEach(x=>{let i=x.querySelector('input'),q=Math.max(0,parseInt(i.value||0));i.value=q;t+=q*+x.dataset.price});total.textContent=t.toLocaleString('en-US',{style:'currency',currency:'USD'});return t}P.forEach(x=>{let i=x.querySelector('input');x.querySelector('.a').onclick=()=>{i.value=+i.value+1;calc()};x.querySelector('.m').onclick=()=>{i.value=Math.max(0,+i.value-1);calc()};i.oninput=calc});clear.onclick=()=>{P.forEach(x=>x.querySelector('input').value=0);calc()};sendBtn.onclick=async()=>{const name=custName.value.trim(),phone=custPhone.value.trim();if(!name){custName.focus();return alert('Ingresa tu nombre.')}if(!phone){custPhone.focus();return alert('Ingresa tu teléfono.')}localStorage.setItem('pedido_name',name);localStorage.setItem('pedido_phone',phone);let s=[],items=[],t=0;P.forEach(x=>{let q=+x.querySelector('input').value;if(q){let price=+x.dataset.price,cost=+x.dataset.cost,z=q*price;t+=z;s.push(`• ${x.dataset.name} — ${q} bolsa${q==1?'':'s'} — $${z.toFixed(2)}`);items.push({itemNumber:x.dataset.item,description:x.dataset.name,qty:q,salePrice:price,cost:cost})}});if(!items.length)return alert('Selecciona al menos un producto.');const payload={name,phone,total:Number(t.toFixed(2)),items};let m=['Hola, quiero hacer el siguiente pedido:','',`Nombre: ${name}`,`Teléfono: ${phone}`,'',...s,'',`TOTAL: $${t.toFixed(2)}`].join('\n');sendBtn.disabled=true;sendBtn.textContent='Registrando...';try{await fetch(ORDER_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});sendBtn.textContent='Abriendo WhatsApp...';window.location.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(m)}`}catch(err){sendBtn.disabled=false;sendBtn.textContent='Enviar por WhatsApp';alert('No se pudo registrar el pedido. Intenta nuevamente.')}};calc()</script></body></html>
